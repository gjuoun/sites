name: Deploy blackboard site to Cloudflare Pages

# blackboard's landing page (bilingual). Deliberately NOT the app: blackboard is a local server
# (dynamic routes + an API that reads $BLACKBOARD_HOME from disk), so publishing it to Pages would
# ship a 404 and a set of routes with no filesystem behind them. What publishes is site/, the
# hand-written release page.
#
# The Pages project does not exist yet, hence the create step: it is idempotent (|| true) and only
# matters on the first run.

on:
  push:
    branches: [main]
    paths:
      - 'apps/blackboard/site/**'
      - '.github/workflows/deploy-blackboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blackboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Astro's CLI refuses to run on an unsupported Node: qublack's astro 7.4.2 needs >=22.23.4
      # while the runner image ships 22.23.3, and it fails as 'Node.js v22.23.3 is not supported'.
      # Pinning 24 here makes every workflow use one supported runtime, whatever astro's floor is.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create blackboard --production-branch main || true
      # A base mismatch is invisible in review and fatal in the browser: fail before deploy if
      # any built page references its own assets through a subpath (see scripts/check-asset-prefixes.sh).
      - run: ./scripts/check-asset-prefixes.sh apps/blackboard/site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/blackboard/site --project-name blackboard --branch main
