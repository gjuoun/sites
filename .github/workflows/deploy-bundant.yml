name: Deploy bundant docs to Cloudflare Pages

# bundant.qqntt.com, served from the ROOT of the domain. This replaces the cross-repo stopgap that
# lived in bigface-theme purely because the Cloudflare token was in that repo's secrets — the
# monorepo holds the token now, so the site can deploy from its own source.
#
# No SITE_BASE here on purpose: the base is '/' in astro.config.mjs. It used to be passed as an env
# var for the GitHub Pages subpath, and turbo filters the task environment, so the variable never
# reached astro — the deploy then published HTML pointing at /bundant/_astro/*, which 404s at the
# root. The base is a property of the site, not of the runner.

on:
  push:
    branches: [main]
    paths:
      - 'apps/bundant/**'
      - 'packages/**'
      - '.github/workflows/deploy-bundant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bundant
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Astro's CLI refuses to run on an unsupported Node: qublack's astro 7.4.2 needs >=22.23.4
      # while the runner image ships 22.23.3, and it fails as 'Node.js v22.23.3 is not supported'.
      # Pinning 24 here makes every workflow use one supported runtime, whatever astro's floor is.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@sites/bundant...
      # A base mismatch is invisible in review and fatal in the browser: fail before deploy if
      # any built page references its own assets through a subpath (see scripts/check-asset-prefixes.sh).
      - run: ./scripts/check-asset-prefixes.sh apps/bundant/dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/bundant/dist --project-name bundant --branch main
