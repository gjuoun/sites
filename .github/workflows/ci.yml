name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # subsdaddy's Z.ai seed test reads a historical commit (`git show <sha>:<path>`), so the clone
      # needs history, not a single commit. A shallow checkout fails that test on every branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Astro's CLI refuses to run on an unsupported Node: qublack's astro 7.4.2 needs >=22.23.4
      # while the runner image ships 22.23.3, and it fails as 'Node.js v22.23.3 is not supported'.
      # Pinning 24 here makes every workflow use one supported runtime, whatever astro's floor is.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Every package's own task, sharded by the runner: typecheck, lint, the whole test suite and
      # each app's build. bigface's packs a vsix.
      - run: bunx turbo run typecheck lint test build
      # A base mismatch is invisible in review and fatal in the browser: fail before deploy if
      # any built page references its own assets through a subpath (see scripts/check-asset-prefixes.sh).
      - run: ./scripts/check-asset-prefixes.sh 

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # business.css is generated from the two palettes. A palette or role-map edit must arrive
      # with the regenerated file; this is the same gate bigface-theme runs on its own themes/.
      - name: packages/bigface-shadcn-ui bigface.css is up to date
        run: |
          bun run --cwd packages/bigface-shadcn-ui theme:sync
          git diff --exit-code packages/bigface-shadcn-ui/src/themes/bigface.css

  vendored-bigface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored copies match the revision in SYNCED_FROM
        run: |
          set -euo pipefail
          rev=$(cat packages/bigface-tokens/SYNCED_FROM)
          echo "bigface-theme @ $rev"
          git clone --quiet https://github.com/gjuoun/bigface-theme "$RUNNER_TEMP/bigface-theme"
          git -C "$RUNNER_TEMP/bigface-theme" checkout --quiet "$rev"
          src="$RUNNER_TEMP/bigface-theme"
          dst=packages/bigface-tokens
          cmp "$src/palette/bigface.json" "$dst/palette/bigface.json"
          cmp "$src/palette/bigface-light.json" "$dst/palette/bigface-light.json"
          cmp "$src/src/contrast-math.ts" "$dst/src/contrast-math.ts"
          cmp "$src/src/installer.ts" "$dst/src/installer.ts"
          diff -r "$src/themes" "$dst/themes"
          echo "vendored copies match $rev"
